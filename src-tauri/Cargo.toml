[package]
name = "ukmac-monitoring"
version = "0.1.9"
description = "UKMAC Monitoring: chili farm (MAC) tables on this computer"
authors = ["UKMAC"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
serde_json = "1.0"
sha2 = "0.10"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
# Sign in with Google and read Google Sheets (src/google.rs): HTTPS with the system's own certificates,
# the loopback listener for Google's answer, and PKCE.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form", "system-proxy"] }
tokio = { version = "1", features = ["net", "time", "io-util", "sync", "rt", "macros"] }
sha2 = "0.10"
base64 = "0.23"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
