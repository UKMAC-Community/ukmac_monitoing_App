<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UKMAC Monitoring</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      /* What the window shows while the app starts: Angular replaces it, so it needs no code. */
      .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #f5f5f7; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .splash img { width: 64px; height: 64px; object-fit: contain; animation: splash-in 0.5s ease both; }
      .splash b { font-size: 15px; letter-spacing: 0.14em; font-weight: 650; animation: splash-in 0.5s 0.08s ease both; }
      .splash small { font-size: 12px; color: #6e6e73; animation: splash-in 0.5s 0.16s ease both; }
      .splash i { display: block; width: 120px; height: 3px; margin-top: 6px; overflow: hidden; border-radius: 3px; background: rgba(0, 102, 217, 0.14); }
      .splash i::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #0066d9; animation: splash-run 1.1s ease-in-out infinite; }
      @keyframes splash-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes splash-run { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) { .splash *, .splash i::after { animation: none !important; } }
    </style>
  </head>
  <body>
    <app-root>
      <div class="splash" role="status" aria-label="Starting UKMAC Monitoring">
        <img src="logo/UKMAC_Logo.webp" alt="" />
        <b>UNIONKMAC</b>
        <small>Monitoring · starting up</small>
        <i></i>
      </div>
    </app-root>
  </body>
</html>
